Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">onlineManager + NetInfo</text><rect x="870.0" y="330.0" width="250.0" height="64.0" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="995.0" y="354.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#78350F" text-anchor="middle">invalidateQueries()</text><text x="995.0" y="374.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#78350F" text-anchor="middle">setelah mutasi berhasil</text><rect x="60.0" y="430.0" width="640.0" height="160.0" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="84.0" y="462.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#E2E8F0" text-anchor="start">useQuery({</text><text x="84.0" y="483.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#E2E8F0" text-anchor="start">  queryKey: [&#x27;attendance&#x27;, &#x27;today&#x27;],</text><text x="84.0" y="504.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#E2E8F0" text-anchor="start">  queryFn: getToday,</text><text x="84.0" y="525.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#86EFAC" text-anchor="start">  staleTime: 30_000,   // 30 detik dianggap fresh</text><text x="84.0" y="546.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#FDBA74" text-anchor="start">  gcTime: 5 * 60_000,  // cache dibuang 5 menit setelah tak dipakai</text><text x="84.0" y="567.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#E2E8F0" text-anchor="start">});</text><rect x="740.0" y="430.0" width="440.0" height="160.0" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="754.0" y="456.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Memilih staleTime</text><text x="754.0" y="477.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">Absensi hari ini: 30 detik · Riwayat: 5 menit · Profil: 5–10 menit ·</text><text x="754.0" y="495.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">Data master (kantor, shift): 1 jam. Semakin jarang berubah, semakin</text><text x="754.0" y="512.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">panjang.</text></svg>
