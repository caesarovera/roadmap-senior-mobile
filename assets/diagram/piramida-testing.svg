ica Neue', Arial, sans-serif" font-size="12" fill="#831843" text-anchor="start">mock</text><rect x="720.0" y="260.0" width="480.0" height="100.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="734.0" y="286.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="start">Component · ±10–20</text><text x="734.0" y="308.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1E3A8A" text-anchor="start">LoginScreen: field kosong, password salah, sukses · Beranda: loading /</text><text x="734.0" y="326.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1E3A8A" text-anchor="start">kosong / error / data · Form izin: validasi tanggal</text><rect x="720.0" y="410.0" width="480.0" height="100.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="734.0" y="436.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="start">Unit · sebanyak mungkin</text><text x="734.0" y="458.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#14532D" text-anchor="start">distanceMeters, isWithinRadius, status terlambat, formatRupiah, store auth</text><text x="734.0" y="476.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#14532D" text-anchor="start">(login/logout) · Pest: setiap endpoint (sukses, 422, 403, aturan bisnis)</text><text x="720.0" y="98.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">Contoh di aplikasi absensi</text><rect x="40.0" y="584.0" width="1160.0" height="36.1" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><rect x="40.0" y="584.0" width="5.0" height="36.1" rx="2" fill="#D97706" stroke="none" stroke-width="0"/><text x="56.0" y="605.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#78350F" text-anchor="start">Prioritas: uji LOGIKA BISNIS dulu (murah, nilainya tinggi). Jangan mengejar angka coverage. Uji perilaku yang dilihat user, bukan detail implementasi.</text></svg>
