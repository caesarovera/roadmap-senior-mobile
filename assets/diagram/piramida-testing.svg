<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img"><title>Piramida Testing</title><defs><marker id="p64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="1239" height="639" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="32.0" y="44.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Piramida Testing</text><text x="32.0" y="68.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748B" text-anchor="start">Banyak test kecil yang cepat di bawah, sedikit test besar yang lambat di atas.</text><path d="M 360.0 110 L 360.0 110 L 440.0 230 L 280.0 230 Z" stroke="#DB2777" stroke-width="1.8" fill="#FDF2F8" stroke-linejoin="round"/><text x="360.0" y="176.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#831843" text-anchor="middle">E2E</text><text x="360.0" y="194.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#831843" text-anchor="middle">Maestro</text><path d="M 280.0 230 L 440.0 230 L 546.7 390 L 173.3 390 Z" stroke="#2563EB" stroke-width="1.8" fill="#EFF6FF" stroke-linejoin="round"/><text x="360.0" y="306.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A" text-anchor="middle">Component</text><text x="360.0" y="328.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">React Native Testing Library +</text><text x="360.0" y="343.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" f