<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img"><title>Cara Kerja React Native (Arsitektur Baru)</title><defs><marker id="p475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="p64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="1239" height="699" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="32.0" y="44.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Cara Kerja React Native (Arsitektur Baru)</text><text x="32.0" y="68.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748B" text-anchor="start">Kode Anda berjalan di JS thread. Layar digambar oleh UI thread. JSI menghubungkan keduanya tanpa serialisasi JSON.</text><rect x="40.0" y="110.0" width="400.0" height="420.0" rx="16" fill="#EFF6FF" fill-opacity="0.45" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="56.0" y="98.0" width="168.3" height="24.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text x="140.1" y="114.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="middle">JS THREAD  ·  Hermes</text><rect x="64.0" y="140.0" width="352.0" height="74.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="240.0" y="169.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Kode Anda</text><text x="240.0" y="190.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#1E3A8A" text-anchor="middle">komponen, hooks, logika</text><rect x="64.0" y="232.0" width="352.0" height="74.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="240.0" y="261.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">React</text><text x="240.0" y="282.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#1E3A8A" text-anchor="middle">render → tree elemen baru</text><rect x="64.0" y="324.0" width="352.0" height="74.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="240.0" y="353.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">TanStack Query · Zustand</text><text x="240.0" y="374.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#1E3A8A" text-anchor="middle">state &amp; cache</text><rect x="64.0" y="416.0" width="352.0" height="74.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="240.0" y="445.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Event handler</text><text x="240.0" y="466.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#1E3A8A" text-anchor="middle">onPress, onChangeText</text><rect x="500.0" y="200.0" width="240.0" height="240.0" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="620.0" y="286.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="700" fill="#0F172A" text-anchor="middle">JSI</text><text x="620.0" y="308.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#0F172A" text-anchor="middle">C++ interface: JS bisa memanggil</text><text x="620.0" y="326.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#0F172A" text-anchor="middle">fungsi native secara LANGSUNG</text><text x="620.0" y="343.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#0F172A" text-anchor="middle">(sinkron), tanpa bridge JSON</text><text x="620.0" y="360.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#0F172A" text-anchor="middle">seperti arsitektur lama.</text><rect x="800.0" y="110.0" width="400.0" height="420.0" rx="16" fill="#FFF7ED" fill-opacity="0.45" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="816.0" y="98.0" width="207.4" height="24.0" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.4"/><text x="919.7" y="114.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#EA580C" text-anchor="middle">UI THREAD (main)  ·  native</text><rect x="824.0" y="140.0" width="352.0" height="74.0" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="1000.0" y="169.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#7C2D12" text-anchor="middle">Fabric renderer</text><text x="1000.0" y="190.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#7C2D12" text-anchor="middle">menghitung perubahan, menerapkan ke view native</text><rect x="824.0" y="232.0" width="352.0" height="74.0" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="1000.0" y="261.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#7C2D12" text-anchor="middle">View native asli</text><text x="1000.0" y="282.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#7C2D12" text-anchor="middle">android.view.View · UIView (bukan WebView)</text><rect x="824.0" y="324.0" width="352.0" height="74.0" rx="12" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/><text x="1000.0" y="353.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#831843" text-anchor="middle">Reanimated worklet</text><text x="1000.0" y="374.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#831843" text-anchor="middle">animasi &amp; gesture langsung di UI thread</text><rect x="824.0" y="416.0" width="352.0" height="90.0" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/><text x="1000.0" y="444.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#134E4A" text-anchor="middle">TurboModules</text><text x="1000.0" y="466.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#134E4A" text-anchor="middle">kamera, GPS, SecureStore, modul buatan Anda (Expo</text><text x="1000.0" y="483.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#134E4A" text-anchor="middle">Modules API)</text><path d="M 440.0 260.0 L 500.0 290.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="440.0" y="252.5" width="47.9" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="464.0" y="265.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">render</text><path d="M 740.0 290.0 L 824.0 190.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="756.1" y="220.5" width="51.7" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="782.0" y="233.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">commit</text><path d="M 824.0 460.0 L 740.0 400.0" stroke="#64748B" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#p64748B)" stroke-linejoin="round"/><rect x="764.3" y="410.5" width="35.4" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="782.0" y="423.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">hasil</text><path d="M 740.0 360.0 L 824.0 450.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><path d="M 500.0 380.0 L 440.0 420.0" stroke="#64748B" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#p64748B)" stroke-linejoin="round"/><rect x="449.2" y="380.5" width="41.6" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="470.0" y="393.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">event</text><text x="40.0" y="576.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Anggaran per frame (60 fps)</text><rect x="40.0" y="590.0" width="760.0" height="34.0" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/><rect x="40.0" y="590.0" width="520.0" height="34.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.4"/><text x="300.0" y="612.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14532D" text-anchor="middle">≤ 16 ms: halus</text><rect x="560.0" y="590.0" width="240.0" height="34.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/><text x="680.0" y="612.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="middle">&gt; 16 ms: frame terlewat (jank)</text><text x="40.0" y="648.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="start">Kalau JS thread sibuk (loop berat, render berlebih), interaksi &amp; animasi berbasis JS tersendat.</text><rect x="840.0" y="566.0" width="360.0" height="70.2" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><rect x="840.0" y="566.0" width="5.0" height="70.2" rx="2" fill="#D97706" stroke="none" stroke-width="0"/><text x="856.0" y="587.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#78350F" text-anchor="start">Solusi: kurangi kerja di JS thread (memo, FlashList),</text><text x="856.0" y="604.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#78350F" text-anchor="start">pindahkan animasi ke UI thread (Reanimated), dan ukur</text><text x="856.0" y="621.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#78350F" text-anchor="start">di build release.</text></svg>
