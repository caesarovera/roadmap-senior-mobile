<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img"><title>Event Loop JavaScript</title><defs><marker id="p16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16A34A"/></marker><marker id="p475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="pD97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker></defs><rect x="0.5" y="0.5" width="1239" height="699" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="32.0" y="44.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Event Loop JavaScript</text><text x="32.0" y="68.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748B" text-anchor="start">Kenapa Promise.then() selalu jalan sebelum setTimeout(..., 0)? Karena microtask dikosongkan dulu.</text><rect x="40.0" y="100.0" width="400.0" height="300.0" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="60.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#64748B" text-anchor="start">// Tebak urutan output-nya</text><text x="60.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#E2E8F0" text-anchor="start">console.log(&#x27;A&#x27;);</text><text x="60.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#FDBA74" text-anchor="start">setTimeout(() =&gt; console.log(&#x27;B&#x27;), 0);</text><text x="60.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#86EFAC" text-anchor="start">Promise.resolve().then(() =&gt; console.log(&#x27;C&#x27;));</text><text x="60.0" y="270.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#86EFAC" text-anchor="start">queueMicrotask(() =&gt; console.log(&#x27;D&#x27;));</text><text x="60.0" y="304.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve" fill="#E2E8F0" text-anchor="start">console.log(&#x27;E&#x27;);</text><text x="60.0" y="372.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="start">putih = sinkron · hijau = microtask · oranye = macrotask</text><rect x="520.0" y="100.0" width="300.0" height="170.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="534.0" y="126.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="700" fill="#1E3A8A" text-anchor="start">Call Stack</text><text x="534.0" y="148.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#1E3A8A" text-anchor="start">kode sinkron dijalankan di sini, satu per satu</text><rect x="540.0" y="170.0" width="260.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="670.0" y="191.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" xml:space="preserve" fill="#1E3A8A" text-anchor="middle">console.log(&#x27;E&#x27;)</text><rect x="540.0" y="210.0" width="260.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="670.0" y="231.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" xml:space="preserve" fill="#1E3A8A" text-anchor="middle">main()</text><rect x="880.0" y="100.0" width="320.0" height="170.0" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="894.0" y="126.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="700" fill="#0F172A" text-anchor="start">Web API / Runtime</text><text x="894.0" y="148.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#0F172A" text-anchor="start">timer, fetch, I/O berjalan di luar JS. Setelah</text><text x="894.0" y="166.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#0F172A" text-anchor="start">selesai, callback-nya dimasukkan ke antrean.</text><rect x="900.0" y="200.0" width="280.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/><text x="1040.0" y="225.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" xml:space="preserve" fill="#0F172A" text-anchor="middle">timer 0 ms → callback B</text><rect x="520.0" y="310.0" width="680.0" height="110.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="534.0" y="336.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="700" fill="#14532D" text-anchor="start">Microtask queue (prioritas TINGGI)</text><rect x="840.0" y="356.0" width="160.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2"/><text x="920.0" y="381.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" xml:space="preserve" fill="#14532D" text-anchor="middle">() =&gt; log(&#x27;C&#x27;)</text><rect x="1020.0" y="356.0" width="160.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2"/><text x="1100.0" y="381.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" xml:space="preserve" fill="#14532D" text-anchor="middle">() =&gt; log(&#x27;D&#x27;)</text><text x="540.0" y="372.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#14532D" text-anchor="start">Promise.then, await, queueMicrotask</text><text x="540.0" y="392.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14532D" text-anchor="start">(1) dikosongkan SEMUA dulu</text><rect x="520.0" y="450.0" width="680.0" height="100.0" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="534.0" y="476.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="700" fill="#78350F" text-anchor="start">Macrotask queue</text><rect x="840.0" y="490.0" width="160.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><text x="920.0" y="515.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" xml:space="preserve" fill="#78350F" text-anchor="middle">() =&gt; log(&#x27;B&#x27;)</text><text x="540.0" y="506.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">setTimeout, setInterval, I/O</text><text x="540.0" y="526.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#78350F" text-anchor="start">(2) baru ambil SATU, lalu ulangi</text><path d="M 1160.0 240.0 L 1160.0 450.0" stroke="#D97706" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#pD97706)" stroke-linejoin="round"/><path d="M 516 365 C 482 365 482 200 518 200" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#p16A34A)" stroke-linejoin="round"/><path d="M 516 500 C 458 500 458 230 518 230" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#pD97706)" stroke-linejoin="round"/><circle cx="490.0" cy="300.0" r="10" fill="#16A34A"/><text x="490.0" y="304.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="467.0" cy="420.0" r="10" fill="#D97706"/><text x="467.0" y="424.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="40.0" y="600.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Output:</text><rect x="120.0" y="576.0" width="120.0" height="60.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="180.0" y="603.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">A</text><text x="180.0" y="624.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1E3A8A" text-anchor="middle">sinkron</text><path d="M 240.0 606.0 L 260.0 606.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="260.0" y="576.0" width="120.0" height="60.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="320.0" y="603.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">E</text><text x="320.0" y="624.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1E3A8A" text-anchor="middle">sinkron</text><path d="M 380.0 606.0 L 400.0 606.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="400.0" y="576.0" width="120.0" height="60.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="460.0" y="603.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle">C</text><text x="460.0" y="624.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#14532D" text-anchor="middle">microtask</text><path d="M 520.0 606.0 L 540.0 606.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="540.0" y="576.0" width="120.0" height="60.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="600.0" y="603.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle">D</text><text x="600.0" y="624.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#14532D" text-anchor="middle">microtask</text><path d="M 660.0 606.0 L 680.0 606.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="680.0" y="576.0" width="120.0" height="60.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="740.0" y="603.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#78350F" text-anchor="middle">B</text><text x="740.0" y="624.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#78350F" text-anchor="middle">macrotask</text><rect x="840.0" y="572.0" width="360.0" height="68.0" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/><rect x="840.0" y="572.0" width="5.0" height="68.0" rx="2" fill="#64748B" stroke="none" stroke-width="0"/><text x="856.0" y="592.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">Di React Native: state update, hasil fetch, dan event</text><text x="856.0" y="609.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">semuanya melewati antrean ini. Kode sinkron yang berat</text><text x="856.0" y="625.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">memblokir seluruh JS thread.</text></svg>
