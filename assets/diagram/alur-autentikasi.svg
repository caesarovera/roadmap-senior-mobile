 width="1160.0" height="244.0" rx="8" fill="#EFF6FF" fill-opacity="0.5" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="40.0" y="172.0" width="144.3" height="20.0" rx="6" fill="#2563EB" stroke="none" stroke-width="0"/><text x="47.0" y="186.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">1  APLIKASI DIBUKA</text><path d="M 374.0 210.0 L 616.0 210.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="424.3" y="190.5" width="141.3" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="495.0" y="203.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">getItem(&#x27;auth_token&#x27;)</text><path d="M 616.0 246.0 L 374.0 246.0" stroke="#64748B" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#p64748B)" stroke-linejoin="round"/><rect x="404.7" y="226.5" width="180.5" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="495.0" y="239.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle">token (atau null → layar Login)</text><path d="M 374.0 282.0 L 866.0 282.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="463.7" y="262.5" width="312.7" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="275.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">GET /api/v1/auth/me   Authorization: Bearer &lt;token&gt;</text><path d="M 874.0 318.0 L 1116.0 318.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="910.8" y="298.5" width="168.5" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="995.0" y="311.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">cek personal_access_tokens</text><path d="M 866.0 354.0 L 374.0 354.0" stroke="#16A34A" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#p16A34A)" stroke-linejoin="round"/><rect x="565.4" y="334.5" width="109.2" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="347.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#16A34A" text-anchor="middle">200 { data: user }</text><path d="M 370.0 390.0 h 40 v 18 h -38" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="413.0" y="390.5" width="205.5" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="418.0" y="403.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="start">status = &#x27;authenticated&#x27; → Beranda</text><rect x="40.0" y="436.0" width="1160.0" height="234.0" rx="8" fill="#F0FDFA" fill-opacity="0.5" stroke="#0D9488" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="40.0" y="436.0" width="68.2" height="20.0" rx="6" fill="#0D9488" stroke="none" stroke-width="0"/><text x="47.0" y="450.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">2  LOGIN</text><path d="M 124.0 474.0 L 366.0 474.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="183.8" y="454.5" width="122.4" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="245.0" y="467.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">isi email + password</text><path d="M 374.0 510.0 L 866.0 510.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="471.8" y="490.5" width="296.4" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="503.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">POST /auth/login { email, password, device_name }</text><path d="M 874.0 546.0 L 1116.0 546.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="873.4" y="526.5" width="243.2" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="995.0" y="539.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">cek hash password · buat token (30 hari)</text><path d="M 866.0 582.0 L 374.0 582.0" stroke="#16A34A" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#p16A34A)" stroke-linejoin="round"/><rect x="536.5" y="562.5" width="167.1" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="575.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#16A34A" text-anchor="middle">200 { data: { token, user } }</text><path d="M 374.0 618.0 L 616.0 618.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="405.2" y="598.5" width="179.6" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="495.0" y="611.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">setItem(&#x27;auth_token&#x27;, token)</text><path d="M 374.0 654.0 L 866.0 654.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="464.3" y="634.5" width="311.4" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="647.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">POST /devices { push_token }  (daftarkan notifikasi)</text><rect x="40.0" y="690.0" width="1160.0" height="218.0" rx="8" fill="#FEF2F2" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="40.0" y="690.0" width="279.3" height="20.0" rx="6" fill="#DC2626" stroke="none" stroke-width="0"/><text x="47.0" y="704.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">3  TOKEN DICABUT ADMIN / KEDALUWARSA</text><path d="M 374.0 728.0 L 866.0 728.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="545.0" y="708.5" width="150.1" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="721.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">GET /attendances/today</text><path d="M 866.0 764.0 L 374.0 764.0" stroke="#DC2626" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#pDC2626)" stroke-linejoin="round"/><rect x="517.9" y="744.5" width="204.2" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="757.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#DC2626" text-anchor="middle">401 { code: &#x27;UNAUTHENTICATED&#x27; }</text><path d="M 370.0 800.0 h 40 v 18 h -38" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="413.0" y="800.5" width="356.8" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="418.0" y="813.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="start">interceptor → signOut() (hanya SEKALI walau ada 3 request)</text><path d="M 374.0 846.0 L 616.0 846.0" stroke="#334155" stroke-width="1.7" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="416.4" y="826.5" width="157.2" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="495.0" y="839.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">deleteItem(&#x27;auth_token&#x27;)</text><path d="M 370.0 882.0 h 40 v 18 h -38" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#p334155)" stroke-linejoin="round"/><rect x="413.0" y="882.5" width="194.0" height="19.5" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="418.0" y="895.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="start">queryClient.clear() → layar Login</text><rect x="40.0" y="96.0" width="160.0" height="50.0" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="120.0" y="124.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Karyawan</text><rect x="290.0" y="96.0" width="160.0" height="50.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="370.0" y="124.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">Aplikasi (RN)</text><rect x="540.0" y="96.0" width="160.0" height="50.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="620.0" y="124.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D" text-anchor="middle">SecureStore</text><rect x="790.0" y="96.0" width="160.0" height="50.0" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="870.0" y="124.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#7C2D12" text-anchor="middle">Laravel API</text><rect x="1040.0" y="96.0" width="160.0" height="50.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="1120.0" y="124.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D" text-anchor="middle">Database</text><rect x="40.0" y="948.0" width="1160.0" height="35.4" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><rect x="40.0" y="948.0" width="5.0" height="35.4" rx="2" fill="#D97706" stroke="none" stroke-width="0"/><text x="56.0" y="969.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#78350F" text-anchor="start">Pengecualian: 401 dari /auth/login berarti password salah, BUKAN sesi berakhir, jadi interceptor tidak boleh memicu logout global untuk endpoint itu.</text></svg>
