<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img"><title>Arsitektur Aplikasi Mobile: Berbasis Fitur &amp; Berlapis</title><defs><marker id="p475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><rect x="0.5" y="0.5" width="1179" height="759" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="32.0" y="44.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Arsitektur Aplikasi Mobile: Berbasis Fitur &amp; Berlapis</text><text x="32.0" y="68.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748B" text-anchor="start">Setiap fitur punya folder sendiri. Di dalam fitur, kode dibagi per lapisan, dan dependency hanya boleh mengarah ke bawah.</text><rect x="40.0" y="110.0" width="480.0" height="82.0" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="54.0" y="137.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">app/ (routing)</text><text x="54.0" y="159.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0F172A" text-anchor="start">File tipis: hanya me-re-export screen dari fitur</text><path d="M 280.0 192.0 L 280.0 214.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="40.0" y="214.0" width="480.0" height="82.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="54.0" y="241.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="start">Screen &amp; Komponen</text><text x="54.0" y="263.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#1E3A8A" text-anchor="start">Menampilkan data &amp; menangani interaksi. Tidak ada logika bisnis.</text><path d="M 280.0 296.0 L 280.0 318.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="40.0" y="318.0" width="480.0" height="82.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="54.0" y="345.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="start">Hooks fitur</text><text x="54.0" y="367.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#1E3A8A" text-anchor="start">useCheckIn, useHistory: menggabungkan query/mutation + logika UI</text><path d="M 280.0 400.0 L 280.0 422.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="40.0" y="422.0" width="480.0" height="82.0" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/><text x="54.0" y="449.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#134E4A" text-anchor="start">API / Repository</text><text x="54.0" y="471.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#134E4A" text-anchor="start">Panggilan HTTP (Axios) atau DB lokal (SQLite) + validasi Zod</text><path d="M 280.0 504.0 L 280.0 526.0" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><rect x="40.0" y="526.0" width="480.0" height="82.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="54.0" y="553.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="start">Domain</text><text x="54.0" y="575.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#14532D" text-anchor="start">Fungsi MURNI: hitung jarak, status terlambat. Tanpa React, mudah dites.</text><text x="560.0" y="128.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748B" text-anchor="start">memanggil</text><path d="M 540 140 L 540 600" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#p475569)" stroke-linejoin="round"/><text x="552.0" y="380.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="start">dependency</text><text x="552.0" y="396.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="start">hanya ke bawah</text><rect x="40.0" y="640.0" width="480.0" height="90.0" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="54.0" y="666.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4C1D95" text-anchor="start">Shared: lib/ · components/ui/ · theme/ · utils/</text><text x="54.0" y="687.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#4C1D95" text-anchor="start">api client, query client, storage, Button/Card/Input, design tokens, format</text><text x="54.0" y="705.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.0" fill="#4C1D95" text-anchor="start">Rupiah &amp; tanggal</text><rect x="680.0" y="110.0" width="460.0" height="620.0" rx="16" fill="#EFF6FF" fill-opacity="0.45" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="696.0" y="98.0" width="196.9" height="24.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text x="794.5" y="114.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="middle">src/features/attendance/</text><rect x="704.0" y="142.0" width="412.0" height="50.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><text x="720.0" y="163.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#78350F" text-anchor="start">index.ts</text><text x="720.0" y="181.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">PUBLIC API fitur: satu-satunya pintu masuk</text><rect x="704.0" y="204.0" width="412.0" height="50.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><text x="720.0" y="225.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#1E3A8A" text-anchor="start">screens/</text><text x="720.0" y="243.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">CheckInScreen, HistoryScreen</text><rect x="704.0" y="266.0" width="412.0" height="50.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><text x="720.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#1E3A8A" text-anchor="start">components/</text><text x="720.0" y="305.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">CheckInButton, AttendanceCard</text><rect x="704.0" y="328.0" width="412.0" height="50.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><text x="720.0" y="349.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#1E3A8A" text-anchor="start">hooks.ts</text><text x="720.0" y="367.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">useTodayAttendance, useCheckIn</text><rect x="704.0" y="390.0" width="412.0" height="50.0" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/><text x="720.0" y="411.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#134E4A" text-anchor="start">api.ts</text><text x="720.0" y="429.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">getToday(), checkIn(form)</text><rect x="704.0" y="452.0" width="412.0" height="50.0" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/><text x="720.0" y="473.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#134E4A" text-anchor="start">schema.ts</text><text x="720.0" y="491.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">Zod schema + tipe Attendance</text><rect x="704.0" y="514.0" width="412.0" height="50.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/><text x="720.0" y="535.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#14532D" text-anchor="start">domain/geofence.ts</text><text x="720.0" y="553.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">distanceMeters(), isWithinRadius()</text><rect x="704.0" y="576.0" width="412.0" height="50.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/><text x="720.0" y="597.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" xml:space="preserve" fill="#14532D" text-anchor="start">domain/*.test.ts</text><text x="720.0" y="615.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="start">unit test fungsi murni</text><rect x="704.0" y="650.0" width="412.0" height="68.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><rect x="704.0" y="650.0" width="5.0" height="68.0" rx="2" fill="#D97706" stroke="none" stroke-width="0"/><text x="720.0" y="670.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">Fitur lain hanya boleh: import { useCheckIn } from</text><text x="720.0" y="687.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">&#x27;@/features/attendance&#x27;. Dilarang import file internal fitur lain.</text><text x="720.0" y="703.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#78350F" text-anchor="start">Aturan ini ditegakkan dengan ESLint.</text></svg>
