iddle">422 errors per field</text><text x="468.0" y="343.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="middle">403 tidak berhak</text><path d="M 820.0 236.0 L 820.0 290.0" stroke="#DC2626" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#pDC2626)" stroke-linejoin="round"/><rect x="736.0" y="292.0" width="168.0" height="62.0" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="820.0" y="300.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="middle">Respons error</text><text x="820.0" y="320.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="middle">422 OUTSIDE_GEOFENCE</text><text x="820.0" y="335.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="middle">422</text><text x="820.0" y="350.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#7F1D1D" text-anchor="middle">ALREADY_CHECKED_IN</text><path d="M 1172.0 236.0 L 1172.0 410.0" stroke="#2563EB" stroke-width="1.7" fill="none" marker-end="url(#p2563EB)" stroke-linejoin="round"/><rect x="960.0" y="410.0" width="280.0" height="84.0" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="1100.0" y="429.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">201 Created</text><text x="1100.0" y="449.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" xml:space="preserve" fill="#1E3A8A" text-anchor="middle">{ &quot;data&quot;: {</text><text x="1100.0" y="465.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" xml:space="preserve" fill="#1E3A8A" text-anchor="middle">&quot;id&quot;: 120, &quot;status&quot;: &quot;on_time&quot;</text><text x="1100.0" y="481.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" xml:space="preserve" fill="#1E3A8A" text-anchor="middle">} }</text><rect x="40.0" y="400.0" width="880.0" height="54.2" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><rect x="40.0" y="400.0" width="5.0" height="54.2" rx="2" fill="#D97706" stroke="none" stroke-width="0"/><text x="56.0" y="421.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#78350F" text-anchor="start">Semua error melewati satu tempat: bootstrap/app.php (withExceptions), sehingga aplikasi mobile SELALU menerima format JSON yang</text><text x="56.0" y="439.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#78350F" text-anchor="start">sama: { message, code, errors, meta }. Aplikasi membaca `code`, bukan teks `message`, untuk menentukan reaksi.</text><rect x="40.0" y="476.0" width="880.0" height="36.1" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/><rect x="40.0" y="476.0" width="5.0" height="36.1" rx="2" fill="#64748B" stroke="none" stroke-width="0"/><text x="56.0" y="497.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0F172A" text-anchor="start">Kenapa logika di Action, bukan di Controller? Action bisa dipanggil dari tempat lain (command, job, test) dan mudah diuji sendiri.</text></svg>
